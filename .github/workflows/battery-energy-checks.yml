name: Battery energy checks

on:
  push:
    branches:
      - fix/homevolt-energy-counters
  pull_request:
    paths:
      - 'drivers/homevolt-battery/**'
      - 'lib/battery-energy-counters.js'
      - 'test/battery-energy-counters.test.js'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/battery-energy-checks.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  energy-tests:
    name: Node.js tests and lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Test battery energy counters
        run: npm run test:energy
      - name: ESLint
        run: npm run lint
